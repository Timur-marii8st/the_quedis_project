<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QUEDIS{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('groups.list_groups') }}">QUEDIS</a>
    <span class="navbar-text text-white-50 small">Распределитель тем</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      {% if current_user.is_authenticated %}
        <span class="text-white-50 small">{{ current_user.username }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}" class="m-0">
          <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
        </form>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container mt-4 mb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
